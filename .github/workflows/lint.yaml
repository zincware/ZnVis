name: Linting

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Ruff lint
        run: uvx ruff check --output-format=github .
      - name: Ruff format check
        run: uvx ruff format --check .
